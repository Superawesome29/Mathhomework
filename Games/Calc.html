<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Game of the year</title>
</head>
<body>
    <style>
        body {
            background-color: #0A1D3D; /* Dark sleek background for a gaming site */
            color: #ffffff;
            font-family: sans-serif;
            margin: 20px;
            padding-bottom: 50px;
        }
        
        .button {
            width: 50px;
            height: 50px;
        }
        .canvas {
            background-color: black;
        }
        
    </style>
    <div>
    <button class="button" onClick="input(1)">1</button> <button class="button" onClick="input(2)">2</button> <button class="button" onClick="input(3)">3</button>
    </div> <div>
    <button class="button" onClick="input(4)">4</button> <button class="button" onClick="input(5)">5</button> <button class="button" onClick="input(6)">6</button>
    </div> <div>
    <button class="button" onClick="input(7)">7</button> <button class="button" onClick="input(8)">8</button> <button class="button" onClick="input(9)">9</button>
    </div> <div>
    <button class="button" style="left: 50%" onClick="input(0)">0</button>
    </div> <div>
    <button class="button" style="left: 50%" onClick="input('+')">+</button>
    
    <button class="button" style="left: 50%" onClick="input('-')">-</button>
     
    <button class="button" style="left: 50%" onClick="input('*')">*</button>
    
    <button class="button" style="left: 50%" onClick="input('/')">/</button>
    </div> <div>
    <button class="button" style="left: 50%" onClick="result()">=</button>
    </div>
    <canvas class="canvas" id="canvas" height="250px" width="500px"></canvas>
    <script>
    
    var first = true;
    var inputs = blank;
    var result5 = blank;
        function input(inp) {
            var canvas = document.getElementById('canvas');
            var ctx = canvas.getContext('2d');
            if (first) {
                inputs = inp;
                first=false;
            } else {
                inputs = `${current}${inp}`;
            };
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            ctx.fillStyle = "blue";
            ctx.font = "bold 16px Arial";
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(inputs, (canvas.width / 2), (canvas.height / 2));
            current = inputs;
        
        };
        function result() {
            const expression = current;
            result5 = new Function(`return (${expression})`)();
            let min = 0;
            let max = 20;
            let random = Math.floor(Math.random() * (max - min + 1)) + min;
            if (random => 10) {
                result5 = result5 - 10;
                result5 = result5 / 6;
                result5 = result5 + 50;
            } else {
                result5 = result5 / 5;
                result5 = result5 + 10;
            };
            current = "";
            input(result5);
        }
    </script>
</body>
</html>
